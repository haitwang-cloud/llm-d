<svg xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" viewBox="0 0 820 390"><defs><marker id="arr" markerHeight="6" markerWidth="8" orient="auto" refX="8" refY="3"><polygon fill="#000" points="0 0 8 3 0 6"/></marker></defs><rect width="816" height="386" x="2" y="2" fill="#fff" stroke="#9f659f" stroke-width="3" rx="0"/><text x="410" y="28" fill="#000" font-size="13" font-weight="bold" text-anchor="middle">Multi-Pool Routing Architecture</text><rect width="85" height="70" x="20" y="145" fill="#f3f3f3" stroke="#d9d2e9" stroke-width="1" rx="3"/><text x="62" y="168" fill="#000" font-size="11" font-weight="bold" text-anchor="middle">Client</text><text x="62" y="185" fill="#666" font-size="8" text-anchor="middle">POST /v1/</text><text x="62" y="197" fill="#666" font-size="8" text-anchor="middle">completions</text><line x1="105" x2="143" y1="180" y2="180" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/><rect width="120" height="130" x="145" y="115" fill="#e6e6fa" stroke="#9f659f" stroke-width="2" rx="3"/><text x="205" y="138" fill="#000" font-size="11" font-weight="bold" text-anchor="middle">Proxy</text><text x="205" y="158" fill="#666" font-size="8" text-anchor="middle">1. Receive request</text><text x="205" y="173" fill="#666" font-size="8" text-anchor="middle">2. Call llm-d IPP</text><text x="205" y="188" fill="#666" font-size="8" text-anchor="middle">3. Route by header</text><text x="205" y="203" fill="#666" font-size="8" text-anchor="middle">4. Call llm-d EPP</text><text x="205" y="218" fill="#666" font-size="8" text-anchor="middle">5. Forward request</text><text x="205" y="238" fill="#888" font-size="7" text-anchor="middle">(HTTPRoute rules)</text><rect width="120" height="60" x="145" y="270" fill="#e8f4e8" stroke="#82b366" stroke-width="1.5" rx="3"/><text x="205" y="292" fill="#000" font-size="10" font-weight="bold" text-anchor="middle">llm-d IPP</text><text x="205" y="308" fill="#666" font-size="8" text-anchor="middle">Process payload</text><text x="205" y="320" fill="#888" font-size="7" text-anchor="middle">(ext-proc)</text><line x1="185" x2="185" y1="245" y2="268" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/><line x1="225" x2="225" y1="268" y2="245" stroke="#666" stroke-dasharray="3 2" stroke-width="1" marker-end="url(#arr)"/><line x1="265" x2="343" y1="150" y2="100" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/><text x="305" y="110" fill="#444" font-size="7" text-anchor="middle">Qwen/...</text><line x1="265" x2="343" y1="210" y2="260" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/><text x="305" y="250" fill="#444" font-size="7" text-anchor="middle">deepseek/...</text><rect width="455" height="105" x="345" y="45" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5" rx="5"/><text x="572" y="63" fill="#000" font-size="11" font-weight="bold" text-anchor="middle">InferencePool A (Qwen/Qwen3-32B)</text><rect width="85" height="50" x="360" y="75" fill="#f3f3f3" stroke="#d9d2e9" stroke-width="1" rx="3"/><text x="402" y="95" fill="#000" font-size="9" font-weight="bold" text-anchor="middle">llm-d EPP</text><text x="402" y="110" fill="#666" font-size="7" text-anchor="middle">Select endpoint</text><text x="402" y="120" fill="#888" font-size="6" text-anchor="middle">(ext-proc)</text><line x1="445" x2="483" y1="100" y2="100" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/><rect width="50" height="38" x="485" y="78" fill="#fff" stroke="#d9d2e9" stroke-width="1" rx="2"/><text x="510" y="100" fill="#666" font-size="7" text-anchor="middle">Model</text><rect width="50" height="38" x="545" y="78" fill="#fff" stroke="#d9d2e9" stroke-width="1" rx="2"/><text x="570" y="100" fill="#666" font-size="7" text-anchor="middle">Model</text><rect width="50" height="38" x="605" y="78" fill="#fff" stroke="#d9d2e9" stroke-width="1" rx="2"/><text x="630" y="100" fill="#666" font-size="7" text-anchor="middle">Model</text><text x="720" y="100" fill="#888" font-size="7" text-anchor="middle">+ LoRA:</text><text x="720" y="112" fill="#888" font-size="7" text-anchor="middle">food-review-1</text><rect width="455" height="105" x="345" y="210" fill="#f8cecc" stroke="#b85450" stroke-width="1.5" rx="5"/><text x="572" y="228" fill="#000" font-size="11" font-weight="bold" text-anchor="middle">InferencePool B (deepseek/DeepSeek-r1)</text><rect width="85" height="50" x="360" y="240" fill="#f3f3f3" stroke="#d9d2e9" stroke-width="1" rx="3"/><text x="402" y="260" fill="#000" font-size="9" font-weight="bold" text-anchor="middle">llm-d EPP</text><text x="402" y="275" fill="#666" font-size="7" text-anchor="middle">Select endpoint</text><text x="402" y="285" fill="#888" font-size="6" text-anchor="middle">(ext-proc)</text><line x1="445" x2="483" y1="265" y2="265" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/><rect width="50" height="38" x="485" y="243" fill="#fff" stroke="#d9d2e9" stroke-width="1" rx="2"/><text x="510" y="265" fill="#666" font-size="7" text-anchor="middle">Model</text><rect width="50" height="38" x="545" y="243" fill="#fff" stroke="#d9d2e9" stroke-width="1" rx="2"/><text x="570" y="265" fill="#666" font-size="7" text-anchor="middle">Model</text><rect width="50" height="38" x="605" y="243" fill="#fff" stroke="#d9d2e9" stroke-width="1" rx="2"/><text x="630" y="265" fill="#666" font-size="7" text-anchor="middle">Model</text><text x="720" y="258" fill="#888" font-size="7" text-anchor="middle">+ LoRA:</text><text x="720" y="270" fill="#888" font-size="7" text-anchor="middle">ski-resorts,</text><text x="720" y="282" fill="#888" font-size="7" text-anchor="middle">movie-critique</text><text x="572" y="340" fill="#666" font-size="8" font-style="italic" text-anchor="middle">1 InferencePool : 1 llm-d EPP : 1 base model</text><text x="410" y="375" fill="#888" font-size="9" text-anchor="middle">Proxy routes to InferencePool based on headers from llm-d IPP; llm-d EPP selects endpoint within pool</text></svg>