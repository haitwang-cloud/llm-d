<svg xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" font-size="13" viewBox="0 0 880 800"><defs><marker id="arr" markerHeight="6" markerWidth="8" orient="auto" refX="8" refY="3"><polygon fill="#000" points="0 0 8 3 0 6"/></marker></defs><rect width="880" height="800" fill="#fff"/><rect width="880" height="48" x="0" y="0" fill="#f3f3f3"/><line x1="0" x2="880" y1="48" y2="48" stroke="#d9d2e9" stroke-width="1"/><rect width="880" height="800" fill="none" stroke="#d9d2e9" stroke-width="2.5" rx="4"/><text x="440" y="30" fill="#000" font-size="16" font-weight="600" text-anchor="middle">WVA Scaling Engine Pipeline</text><rect width="170" height="52" x="80" y="72" fill="#f3f3f3" stroke="#d9d2e9" stroke-width="1" rx="3"/><circle cx="108" cy="98" r="12" fill="#fff" stroke="#d9d2e9" stroke-width="1"/><text x="108" y="98" fill="#000" dominant-baseline="central" font-size="14" font-weight="700" text-anchor="middle">P</text><text x="175" y="95" fill="#000" font-weight="600" text-anchor="middle">Prometheus</text><text x="175" y="110" fill="#666" font-size="11" text-anchor="middle">vLLM &amp; EPP metrics</text><rect width="220" height="52" x="330" y="72" fill="#f3f3f3" stroke="#d9d2e9" stroke-width="1" rx="3"/><circle cx="358" cy="98" r="12" fill="#fff" stroke="#d9d2e9" stroke-width="1"/><text x="358" y="98" fill="#000" dominant-baseline="central" font-size="15" text-anchor="middle">◆</text><text x="460" y="95" fill="#000" font-weight="600" text-anchor="middle">HPA/KEDA Watch</text><text x="460" y="110" fill="#666" font-size="11" text-anchor="middle">Active HPA/KEDA resources</text><rect width="170" height="52" x="630" y="72" fill="#f3f3f3" stroke="#d9d2e9" stroke-width="1" rx="3"/><circle cx="658" cy="98" r="12" fill="#fff" stroke="#d9d2e9" stroke-width="1"/><text x="658" y="98" fill="#000" dominant-baseline="central" font-size="14" font-weight="700" text-anchor="middle">E</text><text x="727" y="95" fill="#000" font-weight="600" text-anchor="middle">EPP Metrics</text><text x="727" y="110" fill="#666" font-size="11" text-anchor="middle">flow control queue size</text><line x1="165" x2="165" y1="124" y2="162" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/><line x1="440" x2="440" y1="124" y2="162" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/><line x1="715" x2="715" y1="124" y2="656" stroke="#000" stroke-dasharray="6 4" stroke-width="1.5" marker-end="url(#arr)"/><rect width="560" height="460" x="39.5" y="168" fill="#f8f8f8" stroke="#d9d2e9" stroke-width="1.5" rx="6"/><rect width="560" height="36" x="40" y="168" fill="#eee" rx="6"/><rect width="560" height="14" x="40" y="190" fill="#eee"/><line x1="40" x2="600" y1="204" y2="204" stroke="#d9d2e9" stroke-width="1"/><text x="320" y="191" fill="#000" font-size="14" font-weight="700" text-anchor="middle">Scaling Engine</text><text x="586.5" y="185.5" fill="#888" font-size="11" font-style="italic" text-anchor="end">every 30s</text><rect width="504" height="40" x="68" y="216" fill="#f3f3f3" stroke="#d9d2e9" stroke-width="1" rx="4"/><circle cx="88" cy="236" r="9" fill="#eee" stroke="#d9d2e9" stroke-width="1.2"/><text x="88" y="236" fill="#000" dominant-baseline="central" font-size="11" font-weight="700" text-anchor="middle">1</text><text x="108" y="233" fill="#000" font-size="12" font-weight="600">Collect</text><text x="108" y="248" fill="#666" font-size="11">Group active HPAs by modelID, scrape per-replica metrics</text><line x1="320" x2="320" y1="256" y2="313" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/><rect width="504" height="80" x="68" y="313" fill="#f3f3f3" stroke="#d9d2e9" stroke-width="1" rx="4"/><circle cx="88" cy="329" r="9" fill="#eee" stroke="#d9d2e9" stroke-width="1.2"/><text x="88" y="329" fill="#000" dominant-baseline="central" font-size="11" font-weight="700" text-anchor="middle">2</text><text x="108" y="334" fill="#000" font-size="12" font-weight="600">Analyze (per model)</text><rect width="148" height="36" x="88" y="345" fi