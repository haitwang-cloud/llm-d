areOptimizer</text><rect width="192" height="20" x="292" y="482" fill="#fff" stroke="#d9d2e9" stroke-width="1" rx="3"/><text x="388" y="496" fill="#000" font-size="11" text-anchor="middle">GreedyByScoreOptimizer</text><text x="567" y="463" fill="#888" font-size="10" font-style="italic" text-anchor="end">VariantDecisions</text><line x1="320" x2="320" y1="510" y2="567" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/><rect width="504" height="48" x="68" y="567" fill="#f3f3f3" stroke="#d9d2e9" stroke-width="1" rx="4"/><circle cx="88" cy="583" r="9" fill="#eee" stroke="#d9d2e9" stroke-width="1.2"/><text x="88" y="583" fill="#000" dominant-baseline="central" font-size="11" font-weight="700" text-anchor="middle">4</text><text x="108" y="588" fill="#000" font-size="12" font-weight="600">Enforce (per model)</text><text x="108" y="605" fill="#666" font-size="11">Scale-to-zero (idle models) &amp; minimum replica guarantee</text><line x1="320" x2="320" y1="615" y2="646" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/><rect width="240" height="52" x="200" y="646" fill="#f3f3f3" stroke="#d9d2e9" stroke-width="1.5" rx="4"/><rect width="6" height="52" x="200" y="646" fill="#e5a000" rx="3"/><text x="326" y="668" fill="#000" font-weight="600" text-anchor="middle">DecisionCache</text><text x="326" y="684" fill="#666" font-size="11" text-anchor="middle">in-memory decision store</text><rect width="220" height="52" x="630" y="656" fill="#f3f3f3" stroke="#d9d2e9" stroke-width="1.5" rx="4"/><rect width="6" height="52" x="630" y="656" fill="#0ea5e9" rx="3"/><text x="746" y="678" fill="#000" font-weight="600" text-anchor="middle">Scale-from-Zero Engine</text><text x="746" y="694" fill="#666" font-size="11" text-anchor="middle">100ms polling, EPP queue check</text><line x1="630" x2="440" y1="676" y2="676" stroke="#000" stroke-dasharray="6 4" stroke-width="1.5" marker-end="url(#arr)"/><line x1="320" x2="320" y1="698" y2="734" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/><rect width="240" height="60" x="200" y="734" fill="#f3f3f3" stroke="#d9d2e9" stroke-width="1.5" rx="4"/><rect width="6" height="60" x="200" y="734" fill="#22c55e" rx="3"/><text x="320" y="758" fill="#000" font-weight="600" text-anchor="middle">Actuator</text><text x="320" y="772" fill="#666" font-size="10" text-anchor="middle">emit WVA metrics (wva_desired_replicas, ...)</text><rect width="230" height="50" x="620" y="744" fill="#f3f3f3" stroke="#d9d2e9" stroke-width="1" rx="4"/><text x="635" y="760" fill="#000" font-size="10" font-weight="600">LEGEND</text><line x1="635" x2="660" y1="774" y2="774" stroke="#000" stroke-width="1.5"/><text x="668" y="778" fill="#444" font-size="10">main loop</text><line x1="730" x2="755" y1="774" y2="774" stroke="#000" stroke-dasharray="6 4" stroke-width="1.5"/><text x="763" y="778" fill="#444" font-size="10">scale-from-zero</text></svg>